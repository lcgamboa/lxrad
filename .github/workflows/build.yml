name: Build lxrad
on: [push]
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install deps
        run: sudo apt-get install libwxgtk3.*-dev libopenal-dev doxygen
      - name: Build
        run: |
          ./make_deps.sh
          ./configure
          make
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install deps
        run: brew install wxwidgets openal-soft doxygen
      - name: Build
        env:
          PKG_CONFIG_PATH: "$(brew --prefix openal-soft)/lib/pkgconfig:${PKG_CONFIG_PATH-}"
        run: |
          ./make_deps.sh
          ./configure LDFLAGS=-L/opt/homebrew/opt/openal-soft/lib CFLAGS="-I/opt/homebrew/opt/openal-soft/include" CXXFLAGS="-std=c++17"
          make
